<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مساعد الأسئلة - أحلى صحبة</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <script src="https://unpkg.com/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0b0404;
      --bg-2: #7a0000;
      --card: #ffffff;
      --accent: #9a4a1a;
      --accent-2: #f0c38e;
      --text: #2f241f;
      --muted: #6b5b52;
      --border: #e2d5c5;
      --success: #0f9d58;
      --error: #d93025;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      color: var(--text);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 18px;
      background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 26%),
                  radial-gradient(circle at 80% 10%, rgba(255,255,255,0.07), transparent 24%),
                  linear-gradient(135deg, #4d0000, #7a0000);
      overflow-y: auto;
      overflow-x: hidden;
    }
    .shell {
      width: min(1200px, 100%);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      position: relative;
      z-index: 1;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .hero {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
      align-items: start;
    }
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
      filter: blur(0px);
      opacity: 0.45;
      animation: spin 28s linear infinite;
      mix-blend-mode: screen;
    }
    .orb.small { width: 160px; height: 160px; }
    .orb.medium { width: 240px; height: 240px; }
    .orb.large { width: 320px; height: 320px; }
    .orb.one { top: 8%; left: 12%; animation-duration: 32s; }
    .orb.two { top: 14%; right: 10%; animation-duration: 26s; }
    .orb.three { bottom: 8%; left: 18%; animation-duration: 30s; }
    .orb.four { bottom: 6%; right: 12%; animation-duration: 34s; }
    @keyframes spin {
      from { transform: rotate(0deg) translateZ(0); }
      to   { transform: rotate(360deg) translateZ(0); }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }
    .title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 20px;
      color: #8a0303;
      margin: 0 0 12px 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .logo-box {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: #f5f5dc;
      display: grid;
      place-items: center;
      box-shadow:
        0 18px 34px rgba(0,0,0,0.18),
        0 0 0 8px rgba(255,255,255,0.14);
    }
    .logo-box img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }
    .brand h1 {
      color: #fff;
      margin: 0;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.3px;
    }
    .brand p {
      color: rgba(255,255,255,0.82);
      margin: 4px 0 0;
      font-weight: 600;
    }
    label { font-weight: 800; display: block; margin: 12px 0 6px; color: var(--text); }
    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      background: #fff;
      box-sizing: border-box;
    }
    textarea { min-height: 96px; resize: vertical; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    button {
      background: linear-gradient(120deg, var(--accent), #c2652b);
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
      box-shadow: 0 10px 20px rgba(154,74,26,0.25);
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    .muted { color: var(--muted); font-size: 13px; }
    .status { margin-top: 8px; font-weight: 800; }
    .success { color: var(--success); }
    .error { color: var(--error); }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 8px; background: var(--accent-2); color: var(--text); font-weight: 700; font-size: 12px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .ghost-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 800;
      box-shadow: none;
      backdrop-filter: blur(6px);
    }
    .google-btn {
      background: #f5f5dc;
      color: #444;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      border: 1px solid rgba(0,0,0,0.06);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
    }
    .google-btn img { width: 18px; height: 18px; }
    .options-container { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .option-row { display: flex; gap: 8px; align-items: center; }
    .option-row input { flex: 1; }
    .option-row button { padding: 8px 10px; background: #7a0000; box-shadow: none; }
    .room-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .room-preview {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 8px;
    }
    .room-preview img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fafafa;
    }
    .divider { border-top: 1px solid rgba(0,0,0,0.08); margin: 12px 0; }
    @media (max-width: 640px) { body { padding: 12px; } }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb small one"></div>
    <div class="orb medium two"></div>
    <div class="orb medium three"></div>
    <div class="orb large four"></div>
  </div>

  <div class="shell">
    <div class="header-row">
      <div class="brand">
        <div class="logo-box">
          <img src="assets/assets/Icon/n_app_icon.png" alt="So7ba logo" />
        </div>
        <div>
          <h1>أحلى صحبة</h1>
          <p>مساعد الأسئلة - صلاحيات مالك/أدمن الغرفة فقط</p>
        </div>
      </div>
      <button id="logout-btn-top" class="ghost-btn" style="display:none;">تسجيل خروج</button>
    </div>

    <div class="hero">
      <div class="card" id="auth-card">
        <p class="title">🚪 تسجيل الدخول</p>
        <button class="google-btn" id="google-btn">
          <img src="assets/assets/Icon/google_logo.png" alt="Google logo" />
          <span>دخول باستخدام جوجل</span>
        </button>
        <p class="muted" style="margin:6px 0 12px;">بنفس حساب التطبيق</p>

        <div class="actions" style="margin-top:8px;">
          <button id="logout-btn" class="ghost-btn" style="display:none;">تسجيل خروج</button>
        </div>
        <div id="auth-status" class="status muted"></div>
      </div>

      <div class="card" id="app-card" style="display:none; min-height: 180px;">
        <p class="title">🧭 اختيار الغرفة المسموح بها</p>
        <label for="rooms">غرفك التي تملكها أو أنت أدمن فيها</label>
        <select id="rooms" style="min-height: 46px; font-size: 15px;"></select>
        <p class="muted" id="room-role" style="margin-top:8px;"></p>
        <div id="room-details" class="muted" style="margin-top:8px;"></div>
        <div id="owner-edit" style="display:none; margin-top:12px;">
          <div class="divider"></div>
          <p class="title" style="font-size:16px; margin-bottom:8px;">✏️ تعديل بيانات الغرفة (مالك فقط)</p>
          <label for="room_name_edit">اسم الغرفة</label>
          <input id="room_name_edit" type="text" placeholder="أدخل الاسم الجديد" />

          <label for="room_desc_edit">وصف الغرفة</label>
          <textarea id="room_desc_edit" placeholder="اكتب وصف الغرفة..."></textarea>

          <label>صورة الغرفة</label>
          <div class="room-preview" style="margin-top:6px;">
            <img id="room_logo_preview" src="" alt="صورة الغرفة" style="display:none;" onerror="this.style.display='none';" />
            <div id="room_logo_empty" class="badge">لا توجد صورة</div>
            <div style="width:100%">
              <label for="room_logo_library" class="muted" style="margin-top:0;">اختر من المكتبة</label>
              <select id="room_logo_library" style="min-height: 46px; font-size: 15px;"></select>
              <label for="room_logo_file" class="muted" style="margin-top:8px;">أو ارفع صورة من الكمبيوتر</label>
              <input id="room_logo_file" type="file" accept="image/*" />
              <div class="actions" style="margin-top:8px;">
                <button type="button" id="upload-room-logo-btn" style="background:#5f5f5f; box-shadow:none;">رفع الصورة</button>
                <button type="button" id="remove-room-logo-btn" class="ghost-btn">حذف الصورة</button>
              </div>
            </div>
          </div>
          <div class="actions" style="margin-top:10px;">
            <button type="button" id="save-room-btn">حفظ التعديلات</button>
            <span class="muted">لن يتم التغيير إلا إذا كنت المالك.</span>
          </div>
          <div id="room-edit-status" class="status muted"></div>
        </div>
      </div>
    </div>

    <div class="card" id="question-card" style="display:none; margin-top:16px;">
      <p class="title">✍️ إضافة سؤال</p>
      <label for="question_text">نص السؤال</label>
      <textarea id="question_text" placeholder="اكتب السؤال هنا"></textarea>

      <div class="row">
        <div>
          <label for="question_type">نوع السؤال</label>
          <select id="question_type">
            <option value="multiple_choice">اختيار من متعدد</option>
            <option value="true_false">صح / خطأ</option>
            <option value="open">مقالي / مفتوح</option>
          </select>
        </div>
        <div>
          <label for="difficulty">درجة الصعوبة (1-5)</label>
          <input id="difficulty" type="number" min="1" max="5" value="1" />
        </div>
      </div>

      <div id="options-group">
        <label>الاختيارات (كل اختيار في حقل مستقل)</label>
        <div id="options-container" class="options-container"></div>
        <div class="actions" style="margin-top:8px;">
          <button type="button" id="add-option-btn" style="background:#5f5f5f; box-shadow:none;">إضافة اختيار</button>
        </div>
      </div>

      <div id="correct-answer-group">
        <label for="correct_answer_select">الإجابة الصحيحة</label>
        <select id="correct_answer_select"></select>
        <input id="correct_answer_text" type="text" placeholder="اكتب الإجابة الصحيحة" style="display:none; margin-top:8px;" />
      </div>

      <div class="row">
        <div>
          <label for="subject">المادة</label>
          <div class="actions" style="gap:8px; align-items: stretch;">
            <select id="subject" style="flex:1; min-height: 46px; font-size: 15px;"></select>
            <button type="button" id="add-subject-btn" style="min-width:46px; background:#5f5f5f; box-shadow:none;">+</button>
          </div>
        </div>
        <div>
          <label for="term">الترم</label>
          <select id="term" style="min-height: 46px; font-size: 15px;">
            <option value="term_1">term_1</option>
            <option value="term_2">term_2</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="chapter">الفصل</label>
          <input id="chapter" type="text" />
        </div>
        <div>
          <label for="lesson">الدرس</label>
          <input id="lesson" type="text" />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="grade_level">الصف الدراسي</label>
          <input id="grade_level" type="text" placeholder="مثال: الصف الثالث" disabled />
        </div>
        <div>
          <label for="education_type">نوع التعليم</label>
          <input id="education_type" type="text" placeholder="مثال: عام / لغات" disabled />
        </div>
      </div>

      <div class="actions" style="margin-top:12px;">
        <button id="submit-btn">رفع السؤال</button>
        <span class="muted" id="helper-text">سيتم الرفع للغرفة المحددة فقط، مع تحقق صلاحية Owner/Admin.</span>
      </div>
      <div id="submit-status" class="status"></div>
    </div>
  </div>

  <script>
    // مفاتيح Supabase (نفس العامة في التطبيق)
    const SUPABASE_URL = 'https://hredzoouykvmoczrtugy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyZWR6b291eWt2bW9jenJ0dWd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyNDI2MzAsImV4cCI6MjA3NzgxODYzMH0.4frhZ21FaYyEkrKap7XH74GsaREfbJts_xz77jULqoc';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authCard = document.getElementById('auth-card');
    const appCard = document.getElementById('app-card');
    const questionCard = document.getElementById('question-card');
    const googleBtn = document.getElementById('google-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const logoutBtnTop = document.getElementById('logout-btn-top');
    const authStatus = document.getElementById('auth-status');
    const roomsSelect = document.getElementById('rooms');
    const roomRole = document.getElementById('room-role');
    const submitBtn = document.getElementById('submit-btn');
    const submitStatus = document.getElementById('submit-status');
    const questionTypeSelect = document.getElementById('question_type');
    const optionsContainer = document.getElementById('options-container');
    const addOptionBtn = document.getElementById('add-option-btn');
    const correctAnswerSelect = document.getElementById('correct_answer_select');
    const correctAnswerText = document.getElementById('correct_answer_text');
    const roomDetails = document.getElementById('room-details');
    const ownerEdit = document.getElementById('owner-edit');
    const roomNameEdit = document.getElementById('room_name_edit');
    const roomDescEdit = document.getElementById('room_desc_edit');
    const roomLogoPreview = document.getElementById('room_logo_preview');
    const roomLogoEmpty = document.getElementById('room_logo_empty');
    const roomLogoLibrary = document.getElementById('room_logo_library');
    const roomLogoFile = document.getElementById('room_logo_file');
    const uploadRoomLogoBtn = document.getElementById('upload-room-logo-btn');
    const removeRoomLogoBtn = document.getElementById('remove-room-logo-btn');
    const roomEditStatus = document.getElementById('room-edit-status');
    const saveRoomBtn = document.getElementById('save-room-btn');

    const subjectSelect = document.getElementById('subject');
    const addSubjectBtn = document.getElementById('add-subject-btn');
    const termSelect = document.getElementById('term');
    const gradeLevelInput = document.getElementById('grade_level');
    const educationTypeInput = document.getElementById('education_type');

    let currentUser = null;
    let allowedRooms = []; // { room_id, name, role, code, description, logo_url, host_id, metadata }
    let subjects = []; // { id, name }
    let selectedRoomLogoUrl = null;

    const ROOM_LOGO_BUCKET = 'room-assets';

    function normalizeStr(v) {
      return (v ?? '').toString().trim();
    }

    function getRoomGradeLevel(metadata) {
      const m = metadata || {};
      const grade = m.educational_level ?? m.grade_level ?? m.grade ?? '';
      const s = normalizeStr(grade);
      return s || 'غير محدد';
    }

    function getRoomEducationType(metadata) {
      const m = metadata || {};
      const type = m.education_type ?? m.subject ?? '';
      const s = normalizeStr(type);
      return s || 'غير محدد';
    }

    function setRoomLogoPreview(url) {
      const u = normalizeStr(url);
      selectedRoomLogoUrl = u || null;
      if (u) {
        roomLogoPreview.src = u;
        roomLogoPreview.style.display = 'block';
        roomLogoEmpty.style.display = 'none';
      } else {
        roomLogoPreview.removeAttribute('src');
        roomLogoPreview.style.display = 'none';
        roomLogoEmpty.style.display = 'inline-flex';
      }
    }

    async function loadRoomLogoLibrary(roomId) {
      roomLogoLibrary.innerHTML = '';
      const first = document.createElement('option');
      first.value = '';
      first.textContent = '— اختر من المكتبة —';
      roomLogoLibrary.appendChild(first);

      try {
        const folder = `room_logos/${roomId}`;
        const { data, error } = await client.storage
          .from(ROOM_LOGO_BUCKET)
          .list(folder, { limit: 100, sortBy: { column: 'created_at', order: 'desc' } });
        if (error) {
          console.warn('[room_logo] list error', error);
          return;
        }
        (data || []).forEach((obj) => {
          if (!obj?.name) return;
          const path = `${folder}/${obj.name}`;
          const url = client.storage.from(ROOM_LOGO_BUCKET).getPublicUrl(path)?.data?.publicUrl;
          const opt = document.createElement('option');
          opt.value = url || '';
          opt.textContent = obj.name;
          roomLogoLibrary.appendChild(opt);
        });
      } catch (e) {
        console.warn('[room_logo] list failed', e);
      }
    }

    async function uploadRoomLogo() {
      const selected = allowedRooms.find((r) => r.room_id === roomsSelect.value);
      if (!selected || selected.role !== 'owner') {
        setStatus(roomEditStatus, 'رفع الصورة مسموح للمالك فقط', 'error');
        return;
      }
      const file = roomLogoFile.files?.[0];
      if (!file) {
        setStatus(roomEditStatus, 'اختر صورة أولاً', 'error');
        return;
      }
      const maxSize = 6 * 1024 * 1024;
      if (file.size > maxSize) {
        setStatus(roomEditStatus, 'حجم الصورة كبير (أقصى 6MB)', 'error');
        return;
      }
      uploadRoomLogoBtn.disabled = true;
      setStatus(roomEditStatus, 'جارٍ رفع الصورة...', 'muted');
      try {
        const ext = (file.name.split('.').pop() || 'png').toLowerCase();
        const safeExt = ext.replace(/[^a-z0-9]/g, '') || 'png';
        const path = `room_logos/${selected.room_id}/${Date.now()}.${safeExt}`;
        const { error } = await client.storage
          .from(ROOM_LOGO_BUCKET)
          .upload(path, file, { upsert: true, contentType: file.type || 'image/png' });
        if (error) {
          setStatus(roomEditStatus, 'فشل رفع الصورة: ' + error.message, 'error');
          return;
        }
        const publicUrl = client.storage.from(ROOM_LOGO_BUCKET).getPublicUrl(path)?.data?.publicUrl;
        setRoomLogoPreview(publicUrl || null);
        await loadRoomLogoLibrary(selected.room_id);
        setStatus(roomEditStatus, 'تم رفع الصورة (اضغط حفظ لتحديث الغرفة)', 'success');
      } catch (e) {
        setStatus(roomEditStatus, 'فشل رفع الصورة: ' + (e?.message || e), 'error');
      } finally {
        uploadRoomLogoBtn.disabled = false;
      }
    }

    async function loadSubjects() {
      subjects = [];
      subjectSelect.innerHTML = '';
      const opt0 = document.createElement('option');
      opt0.value = '';
      opt0.textContent = '— اختر المادة —';
      subjectSelect.appendChild(opt0);
      try {
        const { data, error } = await client
          .from('subjects')
          .select('id, name')
          .eq('is_active', true)
          .order('name');
        if (error) {
          console.warn('[subjects] load error', error);
          return;
        }
        subjects = (data || []).map((s) => ({ id: s.id, name: s.name }));
        subjects.forEach((s) => {
          const o = document.createElement('option');
          o.value = s.name;
          o.textContent = s.name;
          subjectSelect.appendChild(o);
        });
      } catch (e) {
        console.warn('[subjects] load failed', e);
      }
    }

    async function addSubject() {
      const name = normalizeStr(prompt('اسم المادة الجديدة:'));
      if (!name) return;
      addSubjectBtn.disabled = true;
      try {
        const { error } = await client.from('subjects').insert({ name, is_active: true });
        if (error) {
          alert('فشل إضافة المادة: ' + error.message);
          return;
        }
        await loadSubjects();
        subjectSelect.value = name;
      } catch (e) {
        alert('فشل إضافة المادة: ' + (e?.message || e));
      } finally {
        addSubjectBtn.disabled = false;
      }
    }

    function setStatus(el, msg, kind = 'muted') {
      el.textContent = msg || '';
      el.className = `status ${kind}`;
    }

    async function initSession() {
      const { data } = await client.auth.getSession();
      if (data.session) {
        currentUser = data.session.user;
        onLoginSuccess();
      }
    }

    async function loginWithGoogle() {
      setStatus(authStatus, 'جارٍ فتح جوجل...', 'muted');
      googleBtn.disabled = true;
      try {
        await client.auth.signOut(); // نظافة قبل التدفق
        const redirectUrl = window.location.origin + window.location.pathname;
        await client.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: redirectUrl,
            queryParams: { prompt: 'select_account' },
          },
        });
        // على الويب، سيتم إعادة التوجيه وإكمال الجلسة تلقائياً
      } catch (e) {
        setStatus(authStatus, 'فشل جوجل: ' + (e?.message || e), 'error');
        googleBtn.disabled = false;
      }
    }

    async function logout() {
      await client.auth.signOut();
      currentUser = null;
      allowedRooms = [];
      roomsSelect.innerHTML = '';
      authCard.style.display = 'block';
      appCard.style.display = 'none';
      questionCard.style.display = 'none';
      logoutBtn.style.display = 'none';
      logoutBtnTop.style.display = 'none';
      setStatus(authStatus, 'تم تسجيل الخروج', 'muted');
    }

    async function fetchAllowedRooms() {
      roomsSelect.innerHTML = '';
      roomRole.textContent = '';
      allowedRooms = [];
      if (!currentUser) return;

      let memberData = [];
      let roomsInfo = [];

      // محاولة باستخدام join لجلب الأسماء مباشرة
      try {
        const { data: joinData, error: joinError } = await client
          .from('room_members')
          .select('room_id, role, rooms(id, name, code, description, logo_url, host_id, metadata)')
          .eq('user_id', currentUser.id)
          .in('role', ['owner', 'admin']);
        if (joinError) {
          console.warn('[rooms] joinError, fallback to separate fetch', joinError);
        } else if (joinData) {
          memberData = joinData;
          roomsInfo = joinData
            .map((d) => ({
              id: d.room_id,
              name: d.rooms?.name,
              code: d.rooms?.code,
              description: d.rooms?.description,
              logo_url: d.rooms?.logo_url,
              host_id: d.rooms?.host_id,
              metadata: d.rooms?.metadata,
            }))
            .filter((r) => r.id);
        }
      } catch (e) {
        console.warn('[rooms] join fetch failed, fallback', e);
      }

      // لو فشل الـ join أو لم يُرجع أسماء، نجلب room_members ثم rooms بالأيديهات
      if (!memberData.length) {
        const { data: memberDataRaw, error: memberError } = await client
          .from('room_members')
          .select('room_id, role')
          .eq('user_id', currentUser.id)
          .in('role', ['owner', 'admin']);
        memberData = memberError ? [] : (memberDataRaw ?? []);
        if (memberError) console.warn('[rooms] memberError (متجاهَل، سنكمل بما توفر)', memberError);
      }

      if (!roomsInfo.length && memberData.length) {
        try {
          const { data: info, error: roomsInfoError } = await client
            .from('rooms')
            .select('id, name, code, description, logo_url, host_id, metadata')
            .in('id', memberData.map((m) => m.room_id));
          if (roomsInfoError) {
            console.warn('[rooms] roomsInfoError', roomsInfoError);
          } else {
            roomsInfo = info ?? [];
          }
        } catch (e) {
          console.warn('[rooms] roomsInfo fetch failed', e);
        }
      }

      console.log('[rooms] memberData', memberData);
      console.log('[rooms] roomsInfo', roomsInfo);

      const roomsMap = new Map();

      (memberData || []).forEach((m) => {
        const found = roomsInfo.find((r) => r.id === m.room_id);
        roomsMap.set(m.room_id, {
          room_id: m.room_id,
          name: found?.name || '', // سنعرض الاسم فقط، أو نتركه فارغ لو لم يتوفر
          role: m.role,
          code: found?.code,
          description: found?.description,
          logo_url: found?.logo_url,
          host_id: found?.host_id,
          metadata: found?.metadata,
        });
      });

      allowedRooms = Array.from(roomsMap.values());
      console.log('[rooms] merged allowedRooms', allowedRooms);

      if (!allowedRooms.length) {
        roomsSelect.innerHTML = '<option value="">لا توجد غرف لديك صلاحية عليها</option>';
        questionCard.style.display = 'none';
        setStatus(authStatus, 'لا توجد غرف تملكها أو أنت أدمن فيها', 'error');
        return;
      }

      // تأكيد إظهار الكروت بعد النجاح
      authCard.style.display = 'none';
      appCard.style.display = 'block';
      questionCard.style.display = 'block';

      rebuildRoomOptions();
      updateRoomRole();
      setStatus(authStatus, `تم تحميل غرفك (${allowedRooms.length})`, 'success');
    }

    function rebuildRoomOptions() {
      const current = roomsSelect.value;
      roomsSelect.innerHTML = '';
      for (const room of allowedRooms) {
        const opt = document.createElement('option');
        opt.value = room.room_id;
        opt.textContent = `${room.name && room.name !== room.room_id ? room.name : room.room_id} (${room.role === 'owner' ? 'مالك' : 'أدمن'})`;
        roomsSelect.appendChild(opt);
      }
      const exists = allowedRooms.some((r) => r.room_id === current);
      roomsSelect.value = exists ? current : (allowedRooms[0]?.room_id ?? '');
    }

    function renderRoomDetails(selected) {
      if (!selected) {
        roomDetails.innerHTML = '';
        ownerEdit.style.display = 'none';
        return;
      }

      const friendlyName = selected.name && selected.name !== selected.room_id ? selected.name : selected.room_id;
      const desc = selected.description?.trim() || '—';
      const code = selected.code || '—';
      const roleText = selected.role === 'owner' ? 'مالك' : 'أدمن';
      const logo = selected.logo_url || '';

      roomDetails.innerHTML = `
        <div class="room-preview">
          ${logo ? `<img src="${logo}" alt="شعار الغرفة" onerror="this.style.display='none';" />` : '<div class="badge">لا توجد صورة</div>'}
          <div>
            <div><strong>${friendlyName}</strong></div>
            <div class="muted" style="margin-top:4px;">${desc}</div>
          </div>
        </div>
        <div class="room-details-grid">
          <div>الاسم الحالي: <strong>${friendlyName}</strong></div>
          <div>رمز الانضمام: <strong>${code}</strong></div>
          <div>الـ ID: <span style="font-family:monospace;">${selected.room_id}</span></div>
          <div>الدور: ${roleText}</div>
        </div>
      `;

      if (selected.role === 'owner') {
        ownerEdit.style.display = 'block';
        roomNameEdit.value = selected.name || '';
        roomDescEdit.value = selected.description || '';
        setRoomLogoPreview(selected.logo_url || null);
        loadRoomLogoLibrary(selected.room_id);
        setStatus(roomEditStatus, 'يمكنك تعديل الاسم / الوصف / الصورة كمالك', 'muted');
      } else {
        ownerEdit.style.display = 'none';
      }
    }

    function updateRoomRole() {
      const selected = allowedRooms.find((r) => r.room_id === roomsSelect.value);
      roomRole.textContent = selected
        ? `دورك في هذه الغرفة: ${selected.role === 'owner' ? 'مالك' : 'أدمن'}`
        : '';
      renderRoomDetails(selected);

      const metadata = selected?.metadata || {};
      gradeLevelInput.value = getRoomGradeLevel(metadata);
      educationTypeInput.value = getRoomEducationType(metadata);
    }

    function updateCorrectAnswerOptions(optionsList) {
      correctAnswerSelect.innerHTML = '';
      optionsList.forEach((opt) => {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt;
        correctAnswerSelect.appendChild(o);
      });
      if (optionsList.length === 0) {
        const o = document.createElement('option');
        o.value = '';
        o.textContent = 'اختر الاختيارات أولاً';
        correctAnswerSelect.appendChild(o);
      }
    }

    function syncOptionsInputs(questionType) {
      optionsContainer.innerHTML = '';
      let defaults = [];
      if (questionType === 'true_false') {
        defaults = ['صح', 'خطأ'];
      } else if (questionType === 'multiple_choice') {
        defaults = ['اختيار 1', 'اختيار 2'];
      }
      defaults.forEach((val, idx) => addOptionField(val, idx === 0 && questionType !== 'true_false'));
      updateCorrectAnswerOptions(defaults);
      correctAnswerSelect.style.display = 'block';
      correctAnswerText.style.display = 'none';
    }

    function addOptionField(value = '', allowRemove = true) {
      const row = document.createElement('div');
      row.className = 'option-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.value = value;
      input.placeholder = 'اكتب اختيار...';
      input.addEventListener('input', () => {
        const opts = Array.from(optionsContainer.querySelectorAll('input')).map((i) => i.value.trim()).filter((v) => v);
        updateCorrectAnswerOptions(opts);
      });
      row.appendChild(input);
      if (allowRemove) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'حذف';
        btn.addEventListener('click', () => {
          row.remove();
          const opts = Array.from(optionsContainer.querySelectorAll('input')).map((i) => i.value.trim()).filter((v) => v);
          updateCorrectAnswerOptions(opts);
        });
        row.appendChild(btn);
      }
      optionsContainer.appendChild(row);
    }

    function handleQuestionTypeChange() {
      const questionType = questionTypeSelect.value;
      if (questionType === 'open') {
        optionsContainer.innerHTML = '';
        correctAnswerSelect.style.display = 'none';
        correctAnswerText.style.display = 'block';
        correctAnswerText.value = '';
      } else {
        syncOptionsInputs(questionType);
      }
    }

    async function submitQuestion() {
      submitBtn.disabled = true;
      setStatus(submitStatus, 'جارٍ الرفع...', 'muted');

      const roomId = roomsSelect.value;
      const allowed = allowedRooms.find((r) => r.room_id === roomId);
      if (!allowed) {
        setStatus(submitStatus, 'ليست لديك صلاحية على هذه الغرفة', 'error');
        submitBtn.disabled = false;
        return;
      }

      const questionText = document.getElementById('question_text').value.trim();
      const questionType = questionTypeSelect.value;
      const difficulty = Number(document.getElementById('difficulty').value || 1);
      const optionsRaw = Array.from(optionsContainer.querySelectorAll('input'))
        .map((i) => i.value.trim())
        .filter((v) => v);
      const correctAnswer =
        questionType === 'open'
          ? correctAnswerText.value.trim()
          : correctAnswerSelect.value;
      const subject = normalizeStr(subjectSelect.value);
      const term = normalizeStr(termSelect.value);
      const chapter = document.getElementById('chapter').value.trim();
      const lesson = document.getElementById('lesson').value.trim();
      const gradeLevel = normalizeStr(gradeLevelInput.value) || 'غير محدد';
      const educationType = normalizeStr(educationTypeInput.value) || 'غير محدد';

      if (!questionText) {
        setStatus(submitStatus, 'أدخل نص السؤال', 'error');
        submitBtn.disabled = false;
        return;
      }

      let options = [];
      if (questionType === 'multiple_choice' || questionType === 'true_false') {
        options = [...optionsRaw];
        if (questionType === 'true_false') {
          options = ['صح', 'خطأ'];
        }
        if (options.length < 2) {
          setStatus(submitStatus, 'أدخل اختيارين على الأقل', 'error');
          submitBtn.disabled = false;
          return;
        }
        if (!correctAnswer) {
          setStatus(submitStatus, 'أدخل الإجابة الصحيحة', 'error');
          submitBtn.disabled = false;
          return;
        }
      }

      const payload = {
        room_id: roomId,
        created_by: currentUser.id,
        question_text: questionText,
        question_type: questionType,
        correct_answer: questionType === 'open' ? (correctAnswer || '—') : correctAnswer,
        options: options.length ? options : null,
        grade_level: gradeLevel || 'غير محدد',
        education_type: educationType || 'غير محدد',
        subject: subject || 'غير محدد',
        term: term || 'غير محدد',
        chapter: chapter || null,
        lesson: lesson || null,
        difficulty: isNaN(difficulty) ? 1 : Math.max(1, Math.min(5, difficulty)),
        is_active: true,
      };

      const { error } = await client.from('quiz_questions').insert(payload);
      // حتى مع الأخطاء نكمل بما توفر
      document.getElementById('question_text').value = '';
      if (questionType === 'open') {
        correctAnswerText.value = '';
      }
      document.getElementById('chapter').value = '';
      document.getElementById('lesson').value = '';
      if (error) {
        setStatus(submitStatus, 'فشل الرفع: ' + error.message, 'error');
      } else {
        setStatus(submitStatus, 'تم إضافة السؤال بنجاح', 'success');
      }
      submitBtn.disabled = false;
    }

    async function updateRoomInfo() {
      const selected = allowedRooms.find((r) => r.room_id === roomsSelect.value);
      if (!selected || selected.role !== 'owner') {
        setStatus(roomEditStatus, 'التعديل مسموح للمالك فقط', 'error');
        return;
      }

      const newName = roomNameEdit.value.trim();
      const newDesc = roomDescEdit.value.trim();
      const newLogo = normalizeStr(selectedRoomLogoUrl);

      if (!newName) {
        setStatus(roomEditStatus, 'أدخل اسم الغرفة', 'error');
        return;
      }

      saveRoomBtn.disabled = true;
      setStatus(roomEditStatus, 'جارٍ حفظ التغييرات...', 'muted');

      const { error } = await client
        .from('rooms')
        .update({ name: newName, description: newDesc || null, logo_url: newLogo || null })
        .eq('id', selected.room_id)
        .eq('host_id', currentUser.id);

      if (error) {
        setStatus(roomEditStatus, 'فشل الحفظ: ' + error.message, 'error');
      } else {
        // حدّث النسخة المحلية وأعد بناء الخيارات/التفاصيل
        allowedRooms = allowedRooms.map((r) =>
          r.room_id === selected.room_id
            ? { ...r, name: newName, description: newDesc || null, logo_url: newLogo || null }
            : r
        );
        rebuildRoomOptions();
        renderRoomDetails(allowedRooms.find((r) => r.room_id === selected.room_id));
        setStatus(roomEditStatus, 'تم تحديث البيانات', 'success');
      }
      saveRoomBtn.disabled = false;
    }

    async function onLoginSuccess() {
      authCard.style.display = 'none';
      appCard.style.display = 'block';
      logoutBtn.style.display = 'inline-flex';
      logoutBtnTop.style.display = 'inline-flex';
      setStatus(authStatus, 'مسجل كـ ' + (currentUser?.email || ''), 'success');
      await loadSubjects();
      await fetchAllowedRooms();
    }

    googleBtn.addEventListener('click', loginWithGoogle);
    logoutBtn.addEventListener('click', logout);
    logoutBtnTop.addEventListener('click', logout);
    roomsSelect.addEventListener('change', updateRoomRole);
    submitBtn.addEventListener('click', submitQuestion);
    addOptionBtn.addEventListener('click', () => addOptionField('', true));
    questionTypeSelect.addEventListener('change', handleQuestionTypeChange);
    saveRoomBtn.addEventListener('click', updateRoomInfo);
    uploadRoomLogoBtn.addEventListener('click', uploadRoomLogo);
    roomLogoLibrary.addEventListener('change', () => setRoomLogoPreview(roomLogoLibrary.value));
    removeRoomLogoBtn.addEventListener('click', () => setRoomLogoPreview(null));
    addSubjectBtn.addEventListener('click', addSubject);

    initSession();
    handleQuestionTypeChange();
  </script>
</body>
</html>
